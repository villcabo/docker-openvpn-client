name: openvpn-client

networks:
  vpn-network:
    driver: bridge
    ipam:
      config:
        - subnet: 10.55.11.0/28 # Use /28 for 16 IPs

services:
  vpn:
    image: villcabo/openvpn-client:1.0.0
    container_name: ${CONTAINER_NAME:-openvpn-client}
    build: ubuntu-custom
    restart: unless-stopped
    networks:
      vpn-network:
    dns:
      - 199.3.0.253
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ${PATH_CONF:-/path/to/vpn.ovpn}:/root/vpn.ovpn:ro
    devices:
      - /dev/net/tun
    cap_add:
      - NET_ADMIN
    security_opt:
      - no-new-privileges:true
    sysctls:
      net.ipv4.ip_forward: 1
    environment:
      OVPN_USERNAME: ${VPN_USERNAME}
      OVPN_PASSWORD: ${VPN_PASSWORD}
